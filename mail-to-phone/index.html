ur personal copy. Keep your copy private."}};const select=document.getElementById('language');function apply(lang){const t=locales[lang]||locales.en;document.documentElement.lang=lang in locales?lang:'en';document.documentElement.dir=t.dir;document.title=t.title;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t[el.dataset.t]||locales.en[el.dataset.t]);document.getElementById('requirements').replaceChildren(...t.requirements.map(text=>{const li=document.createElement('li');li.textContent=text;return li}));select.value=document.documentElement.lang;}let saved;try{saved=localStorage.getItem('mtp.site.language')}catch{}const detected=(navigator.languages||[navigator.language]).map(l=>l.toLowerCase().split('-')[0]).find(l=>l in locales);apply(saved&&saved in locales?saved:detected||'en');select.addEventListener('change',()=>{apply(select.value);try{localStorage.setItem('mtp.site.language',select.value)}catch{}});</script></body></html>
